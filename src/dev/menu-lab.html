<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Sea State · Menu lab</title>
    <style>
      /* A painted stand-in for the live ocean so glass panels can be judged against something. */
      .lab-ocean {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          #0d2a44 0%,
          #2b5a7e 30%,
          #8fb3c9 47%,
          #d7c7a6 49.4%,
          #1d4a66 50%,
          #0e3049 64%,
          #06182a 100%
        );
      }
      .lab-sun {
        position: absolute;
        left: 64%;
        top: 40%;
        width: 9vmin;
        height: 9vmin;
        border-radius: 50%;
        background: radial-gradient(circle, #fff6df 0 30%, rgba(255, 220, 160, 0.5) 45%, transparent 70%);
        filter: blur(1px);
      }
      .lab-glint {
        position: absolute;
        left: 58%;
        top: 50%;
        width: 18%;
        height: 50%;
        background: linear-gradient(180deg, rgba(255, 236, 200, 0.55), transparent 80%);
        filter: blur(14px);
        clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
      }
      .lab-waves {
        position: absolute;
        left: -10%;
        right: -10%;
        top: 50%;
        bottom: 0;
        background:
          repeating-linear-gradient(178deg, rgba(255, 255, 255, 0.05) 0 2px, transparent 2px 22px),
          repeating-linear-gradient(183deg, rgba(0, 0, 0, 0.12) 0 3px, transparent 3px 31px);
        animation: lab-drift 14s linear infinite;
      }
      @keyframes lab-drift {
        to {
          transform: translateX(8%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .lab-waves {
          animation: none;
        }
      }
      .lab-bar {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 60;
        display: flex;
        gap: 4px;
        font:
          11px system-ui,
          sans-serif;
      }
      .lab-bar a {
        padding: 3px 8px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.45);
        color: #cfe6f5;
        text-decoration: none;
      }
      .lab-log {
        position: fixed;
        right: 8px;
        bottom: 8px;
        z-index: 60;
        width: 360px;
        max-height: 30vh;
        margin: 0;
        padding: 8px 10px;
        overflow: auto;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #bfe3ff;
        font:
          11px/1.35 ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
      .lab-log:empty {
        display: none;
      }
      .lab-playing {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        color: #e8f1f7;
        font:
          300 16px system-ui,
          sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
    </style>
    <script type="module" src="./menuLab.ts"></script>
  </head>
  <body>
    <div class="lab-ocean" aria-hidden="true">
      <div class="lab-sun"></div>
      <div class="lab-glint"></div>
      <div class="lab-waves"></div>
    </div>
    <div class="lab-playing" hidden>Sailing · Esc or Start to pause</div>
    <nav class="lab-bar" aria-label="Lab screens">
      <a href="?screen=main" tabindex="-1">main</a>
      <a href="?screen=setup" tabindex="-1">setup</a>
      <a href="?screen=pause" tabindex="-1">pause</a>
      <a href="?screen=conditions" tabindex="-1">conditions</a>
      <a href="?screen=fleet" tabindex="-1">fleet</a>
      <a href="?screen=settings" tabindex="-1">settings</a>
      <a href="?screen=help" tabindex="-1">help</a>
      <a href="?screen=credits" tabindex="-1">credits</a>
    </nav>
    <pre class="lab-log" aria-live="off"></pre>
  </body>
</html>
