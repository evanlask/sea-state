<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Sea State — sky lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #dfe8ee;
        font:
          12px/1.35 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        overflow: hidden;
      }
      #view {
        position: fixed;
        inset: 0;
      }
      #view canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        width: 290px;
        max-height: calc(100% - 16px);
        overflow: auto;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(8, 14, 20, 0.78);
        backdrop-filter: blur(4px);
      }
      #panel.hidden {
        display: none;
      }
      #panel h1 {
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: 600;
      }
      #panel h2 {
        margin: 10px 0 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.7;
      }
      .row {
        display: grid;
        grid-template-columns: 92px 1fr 46px;
        align-items: center;
        gap: 6px;
        margin: 2px 0;
      }
      .row input[type='range'] {
        width: 100%;
      }
      .row output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .presets button,
      select {
        background: #1d2b36;
        color: inherit;
        border: 1px solid #2f4352;
        border-radius: 4px;
        padding: 2px 6px;
        font: inherit;
      }
      #readout {
        white-space: pre;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
      }
    </style>
    <script type="module" src="./skyLab.ts"></script>
  </head>
  <body>
    <div id="view"></div>
    <div id="panel">
      <h1>Sky lab</h1>
      <div class="presets" id="presets"></div>
      <div id="controls"></div>
      <h2>Readout</h2>
      <div id="readout"></div>
    </div>
  </body>
</html>
