<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Sea State — Sail lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #06121c;
        color: #e8f1f7;
        font:
          12px/1.4 system-ui,
          sans-serif;
      }
      #viewport {
        position: fixed;
        inset: 0;
      }
      #viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        width: 270px;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgb(6 18 28 / 0.78);
      }
      #panel label {
        display: grid;
        grid-template-columns: 82px 1fr 38px;
        align-items: center;
        gap: 6px;
        margin: 2px 0;
      }
      #panel label.check {
        display: flex;
      }
      #panel input[type='range'] {
        width: 100%;
      }
      #panel .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 6px;
      }
      #stats {
        margin-top: 6px;
        font-family: ui-monospace, monospace;
        white-space: pre;
        opacity: 0.85;
      }
      body.clean #panel {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="panel"></div>
    <script type="module" src="./sailLab.ts"></script>
  </body>
</html>
