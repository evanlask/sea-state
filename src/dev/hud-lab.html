<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>HUD lab — Sea State</title>
    <!-- Dev-only page: the HUD over a moving horizon with mock data for every boat.
         URL params: boat, scenario, night, red, dim, mode, scale, speed, length, wind,
         radar, hints, device, t (freeze at a time in seconds), ui=0 (hide lab controls). -->
    <style>
      #lab-bg {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #lab-horizon {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 260vmax;
        height: 260vmax;
        margin: -130vmax 0 0 -130vmax;
        background: linear-gradient(
          180deg,
          #4d87b8 0%,
          #a9cbe2 49.6%,
          #2d6c8c 50%,
          #0e3550 62%,
          #06192a 100%
        );
        will-change: transform;
      }
      .lab-night #lab-horizon {
        background: linear-gradient(
          180deg,
          #01040b 0%,
          #0b1b30 49.6%,
          #04121d 50%,
          #020a12 70%,
          #01050a 100%
        );
      }
      .lab-storm #lab-horizon {
        background: linear-gradient(
          180deg,
          #2c3a46 0%,
          #6b7b86 49.6%,
          #233a48 50%,
          #0d2230 65%,
          #050f17 100%
        );
      }
      .lab-night.lab-storm #lab-horizon {
        background: linear-gradient(
          180deg,
          #010204 0%,
          #0b1118 49.6%,
          #050d13 50%,
          #02070b 70%,
          #010305 100%
        );
      }
      #lab-ui {
        position: fixed;
        top: 50%;
        left: 0.6rem;
        z-index: 50;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        width: 12.5rem;
        padding: 0.6rem 0.7rem;
        transform: translateY(-50%);
        border: 1px solid var(--panel-edge);
        border-radius: 0.6rem;
        background: rgba(4, 10, 16, 0.92);
        font:
          12px/1.3 system-ui,
          sans-serif;
      }
      #lab-ui.is-collapsed > :not(button.lab-toggle) {
        display: none;
      }
      #lab-ui label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.4rem;
      }
      #lab-ui select,
      #lab-ui input[type='range'] {
        width: 7.2rem;
      }
      #lab-ui h2 {
        margin: 0.2rem 0 0;
        color: var(--ink-dim);
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="lab-bg"><div id="lab-horizon"></div></div>
    <div id="app"></div>
    <script type="module" src="./hudLab.ts"></script>
  </body>
</html>
