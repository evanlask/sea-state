<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Sea State — lights lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #dfe8ee;
        font:
          12px/1.35 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        overflow: hidden;
      }
      #view {
        position: fixed;
        inset: 0;
      }
      #view canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        width: 360px;
        max-height: calc(100% - 16px);
        overflow: auto;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(8, 14, 20, 0.78);
        backdrop-filter: blur(4px);
      }
      body.clean #panel {
        display: none;
      }
      #panel h2 {
        margin: 10px 0 4px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.7;
      }
      .row {
        display: grid;
        grid-template-columns: 76px 1fr 64px;
        align-items: center;
        gap: 6px;
        margin: 2px 0;
      }
      .row input[type='range'] {
        width: 100%;
      }
      .row output {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .checks {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
      }
      .checks label {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      #readout {
        margin-top: 8px;
        font:
          11px/1.35 ui-monospace,
          monospace;
        white-space: pre;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="panel">
      <div id="controls"></div>
      <div id="readout"></div>
    </div>
    <script type="module" src="./lightsLab.ts"></script>
  </body>
</html>
