<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Sea State — sail seven real-world boats through any weather, from glassy calm to a Category 5 hurricane."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Sea~State</title>
    <!-- Inline so the boot screen paints before any JavaScript downloads. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #06121c;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        /* The title sits about a third of the way down; the progress hangs below it. */
        grid-template-rows: 1fr auto 2fr;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(120% 90% at 50% 0%, #17405f 0%, #0a2235 45%, #06121c 100%);
        color: #e8f1f7;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        transition: opacity 0.5s ease;
      }
      #boot > :not(.boot-swell) {
        grid-row: 2;
      }
      #boot.boot-done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-title {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5.5rem);
        font-weight: 200;
        letter-spacing: 0.35em;
        text-indent: 0.35em;
        text-transform: uppercase;
      }
      .boot-status {
        margin-top: 1.25rem;
        text-align: center;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        opacity: 0.7;
      }
      .boot-swell {
        position: absolute;
        left: -50%;
        width: 200%;
        height: 40vh;
        bottom: -12vh;
        border-radius: 45%;
        background: rgba(30, 90, 130, 0.35);
        animation: boot-swell 9s ease-in-out infinite;
      }
      .boot-swell.two {
        bottom: -16vh;
        background: rgba(14, 58, 92, 0.6);
        animation-duration: 13s;
        animation-direction: reverse;
      }
      @keyframes boot-swell {
        0%,
        100% {
          transform: translateX(-4%) rotate(-1deg);
        }
        50% {
          transform: translateX(4%) rotate(1.5deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-swell {
          animation: none;
        }
      }
    </style>
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-swell"></div>
      <div class="boot-swell two"></div>
      <div>
        <h1 class="boot-title" aria-label="Sea State">Sea~State</h1>
        <div id="boot-status" class="boot-status">Loading…</div>
      </div>
    </div>
    <div id="app"></div>
  </body>
</html>
